# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/edtech
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:mock}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}

# Google OAuth 2.0 Configuration
google.client.id=${GOOGLE_CLIENT_ID:demo-client-id}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

